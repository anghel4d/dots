# ~/.tmux.conf — lean, no plugin manager. Tuned to sit under Neovim.
# Prefix stays C-b (remapping to C-a would clobber shell start-of-line);
# to switch anyway: set -g prefix C-a; bind C-a send-prefix.

# --- truecolor + instant escape (so nvim colours are right and feel snappy) ---
set -g  default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -sg escape-time 10
set -g  focus-events on

# --- general ---
set -g  mouse on
set -g  history-limit 50000
set -g  base-index 1
setw -g pane-base-index 1
set -g  renumber-windows on
setw -g mode-keys vi
set -g  set-clipboard on
set -g  status-interval 5

# --- splits: | vertical, - horizontal, both keep the current path ---
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window     -c "#{pane_current_path}"

# --- pane nav: prefix h/j/k/l (vim), plus Alt+h/j/k/l with no prefix ---
# nvim uses bare Ctrl-h/j/k/l for its splits, so these Alt bindings never collide.
bind    h select-pane -L
bind    j select-pane -D
bind    k select-pane -U
bind    l select-pane -R
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# --- pane resize: prefix + H/J/K/L (repeatable) ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- vi copy mode: v selects, y yanks ---
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- reload ---
bind r source-file ~/.tmux.conf \; display "reloaded ~/.tmux.conf"

# --- status line: minimal, tokyonight palette to match nvim ---
set -g status-style               "bg=#1f2335,fg=#a9b1d6"
set -g status-justify             centre
set -g status-left                "#[bg=#7aa2f7,fg=#1f2335,bold] #S #[bg=#1f2335,fg=#7aa2f7] "
set -g status-left-length         30
set -g status-right               "#[fg=#565f89]%H:%M #[bg=#3b4261,fg=#c0caf5] #h "
set -g window-status-current-format "#[fg=#7aa2f7,bold] #I:#W "
set -g window-status-format         "#[fg=#565f89] #I:#W "
set -g pane-border-style          "fg=#3b4261"
set -g pane-active-border-style   "fg=#7aa2f7"
set -g message-style              "bg=#3b4261,fg=#c0caf5"
